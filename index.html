<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azure Academy — AZ-900 Quest Trainer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AZ-900 Quest">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg id="bg-pattern" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <g id="ic-cloud"><g transform="translate(-12,-12)"><path d="M17 18H8a4 4 0 0 1-1-7.9A5.5 5.5 0 0 1 16.9 8h.4a4 4 0 0 1-.3 8Z"/></g></g>
    <g id="ic-key"><g transform="translate(-12,-12)"><circle cx="8" cy="8" r="4"/><path d="M11 11 20 20"/><path d="M15.5 15.5 18.5 12.5"/><path d="M18 18 21 15"/></g></g>
    <g id="ic-shield"><g transform="translate(-12,-12)"><path d="M12 3 19 6v6c0 5-3 8-7 9-4-1-7-4-7-9V6Z"/><path d="M9 12l2 2 4-4"/></g></g>
    <g id="ic-gear"><g transform="translate(-12,-12)"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></g></g>
    <g id="ic-db"><g transform="translate(-12,-12)"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></g></g>
    <g id="ic-net"><g transform="translate(-12,-12)"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M8 7l3 9M16 7l-3 9M8 6h8"/></g></g>
    <g id="ic-mail"><g transform="translate(-12,-12)"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 7l9 6 9-6"/></g></g>
    <g id="ic-person"><g transform="translate(-12,-12)"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5c1.5-2.5 3.5-3.5 5.5-3.5s4 1 5.5 3.5"/></g></g>
    <pattern id="cloudTile" width="1200" height="900" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <use href="#ic-cloud" transform="translate(120,170) rotate(-10) scale(4.3)"/>
        <use href="#ic-key" transform="translate(475,135) rotate(16) scale(3.9)"/>
        <use href="#ic-shield" transform="translate(730,185) rotate(-13) scale(4.5)"/>
        <use href="#ic-gear" transform="translate(1065,125) rotate(22) scale(4.0)"/>
        <use href="#ic-db" transform="translate(180,465) rotate(-7) scale(4.6)"/>
        <use href="#ic-net" transform="translate(425,430) rotate(13) scale(4.1)"/>
        <use href="#ic-mail" transform="translate(770,480) rotate(-19) scale(3.8)"/>
        <use href="#ic-person" transform="translate(1035,440) rotate(9) scale(4.4)"/>
        <use href="#ic-gear" transform="translate(130,775) rotate(25) scale(4.0)"/>
        <use href="#ic-cloud" transform="translate(480,735) rotate(-9) scale(4.5)"/>
        <use href="#ic-key" transform="translate(720,770) rotate(15) scale(3.9)"/>
        <use href="#ic-shield" transform="translate(1070,725) rotate(-6) scale(4.3)"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#cloudTile)"/>
</svg>

<div id="shell">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div>
        <div class="brand-text">Azure Academy</div>
        <div class="brand-sub">AZ-900 Quest Trainer</div>
      </div>
    </div>

    <nav class="nav-group">
      <div class="nav-label">Play</div>
      <div class="nav-item" data-page="quests" onclick="goTo('quests')">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 19 6 19 18 12 22 5 18 5 6 12 2"></polygon><line x1="12" y1="22" x2="12" y2="15.5"></line><polyline points="19 6 12 9.5 5 6"></polyline></svg>
        </span>
        Daily Quests
        <span id="chest-badge" class="nav-badge" style="display:none"></span>
      </div>
      <div class="nav-item" data-page="shop" onclick="goTo('shop')">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        </span>
        Loot Shop
      </div>
    </nav>

    <nav class="nav-group">
      <div class="nav-label">Progress</div>
      <div class="nav-item" data-page="mastery" onclick="goTo('mastery')">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 15 9 22 9.5 16.5 14 18.5 21 12 17 5.5 21 7.5 14 2 9.5 9 9Z"></path></svg>
        </span>
        Mastery
      </div>
      <div class="nav-item" data-page="collection" onclick="goTo('collection')">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
        </span>
        Collection
      </div>
      <div class="nav-item" data-page="profile" onclick="goTo('profile')">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </span>
        Profile
      </div>
      <div class="nav-item" data-page="history" onclick="goTo('history')">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"></path><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path><path d="M12 7v5l4 2"></path></svg>
        </span>
        History
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="streak-pill" id="streak-pill">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
        <div>
          <div id="streak-text">0 day streak</div>
          <div id="streak-sub" class="streak-sub"></div>
        </div>
      </div>
      <div class="day-timer" id="day-timer"></div>
    </div>
  </aside>

  <main id="main">
    <div id="page-quests" class="page"></div>
    <div id="page-shop" class="page"></div>
    <div id="page-mastery" class="page"></div>
    <div id="page-collection" class="page"></div>
    <div id="page-profile" class="page"></div>
    <div id="page-history" class="page"></div>
  </main>
</div>

<div id="chest-overlay" class="chest-overlay hidden" onclick="closeChestAnimation(event)">
  <div class="chest-scene">
    <div class="chest-particles" id="chest-particles"></div>
    <div class="chest-icon" id="chest-icon">📦</div>
    <div class="chest-reveal" id="chest-reveal"></div>
    <div class="chest-hint">Click anywhere to continue</div>
  </div>
</div>

<div id="fact-overlay" class="fact-overlay hidden">
  <div class="fact-card">
    <div class="fact-kicker">💡 Daily Azure Fact</div>
    <div class="fact-title" id="fact-title"></div>
    <div class="fact-text" id="fact-text"></div>
    <button class="btn btn-primary" onclick="closeDailyFactModal()">Got it</button>
  </div>
</div>

<div id="pet-companion" class="pet-companion hidden" onclick="petClicked()">
  <div id="pet-bubble" class="pet-bubble"></div>
  <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
    <path d="M30 8c14 0 22 10 22 24 0 14-10 20-22 20S8 46 8 32C8 18 16 8 30 8Z" fill="currentColor"/>
    <circle cx="22" cy="30" r="3" fill="#0B0E1A"/>
    <circle cx="38" cy="30" r="3" fill="#0B0E1A"/>
    <path d="M23 38q7 6 14 0" stroke="#0B0E1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </svg>
</div>

<script src="database.js"></script>
<script src="save.js"></script>
<script src="loot.js"></script>
<script src="mastery.js"></script>
<script src="chestfx.js"></script>
<script src="dailyfact.js"></script>
<script src="practical.js"></script>
<script src="app.js"></script>
</body>
</html>
